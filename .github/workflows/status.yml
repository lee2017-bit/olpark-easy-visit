name: live-status

# 공원 근처 지하철역 엘리베이터 가동현황을 10분마다 확인해 status 브랜치에 status.json 하나만 올린다.
# 사이트(브라우저)는 raw.githubusercontent.com 에서 이 파일을 읽는다. 키는 Actions 안에서만 쓰고 결과만 공개.
on:
  schedule:
    - cron: "4,14,24,34,44,54 21-23,0-14 * * *"   # 06:00~23:59 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 엘리베이터 가동현황
        run: python -m collectors.live_status out/status.json
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: status 브랜치에 올림 (기록은 마지막 한 개만 유지)
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "status $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status

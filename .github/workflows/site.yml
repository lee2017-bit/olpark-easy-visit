name: refresh-data-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * 0,3"   # 매주 월·목 06:17 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # 수집 단계는 실패해도 기존 데이터로 계속 진행 (사이트는 항상 공개 상태 유지)
      - name: 공연 일정 (이번 달~6개월)
        run: python -m collectors.events_homepage --upcoming
        continue-on-error: true
      - name: 공휴일·단기예보
        run: python -m collectors.calendar_weather holidays $(date +%Y) $(( $(date +%Y) + 1 )) forecast
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        continue-on-error: true
      - name: 교통약자 정보 (지하철 엘리베이터·무장애)
        run: python -m collectors.accessibility
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        continue-on-error: true
      - name: 기관 예상 이용률 기록
        run: python -m collectors.agency_prediction
        continue-on-error: true

      - name: 사이트 데이터 생성
        run: python -m build.build_site

      - name: 갱신된 데이터 커밋 (저장소 활동 유지 → 정기 실행이 멈추지 않게)
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed site/data
          git diff --cached --quiet || git commit -m "data: 자동 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
